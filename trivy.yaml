scan:
  scanners:
    - vuln
    - secret
  skip-dirs:
    - node_modules
    - .pnpm-store
    - .venv
    # Harness-managed git worktrees for parallel subagents. They are separate
    # working copies of other branches (each carries its own bun.lock), so
    # scanning them here double-reports findings this checkout cannot fix.
    - .claude/worktrees
