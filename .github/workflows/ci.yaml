name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # Coverage gate (#258). `coverage-gate.mjs` runs `bun test --coverage` and
      # enforces an overall line/function floor parsed from the text reporter
      # (Bun 1.2.23's native coverageThreshold can't express an overall floor for
      # this repo — see bunfig.toml / scripts/coverage-gate.mjs). A failing test
      # still fails the step via bun's own exit code; CI is the source of truth so
      # a PR that bypasses local hooks is gated here. Floor: line ≥ 94%,
      # function ≥ 91% (ratcheted in #265 → #268; raise further as coverage rises).
      - name: Test (coverage gate)
        run: bun run test:coverage

      # Validate the distribution bundle (and its --external list) on every push,
      # not only at release time — a broken build otherwise lands on main unseen.
      - name: Build
        run: bun run build

  # The `check` job validates the npm bundle on every push for the reason its
  # Build step states — a broken build must not land on main unseen. Suasor
  # ships three artifacts, though, and until #600 that principle covered only
  # one: the standalone binary (its own --external list) and the Docker image
  # were first built by the *release* workflow, on the tagged commit, with npm
  # publish already queued behind them. 0.4.2 made that concrete by changing
  # both Dockerfile (#558) and the lockfile the image installs from (#595).
  artifacts:
    name: artifacts (standalone binary + docker build stage)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Cross-checks the binary channel's own --external list (it differs from
      # the npm bundle's), then proves the result actually starts.
      - name: Compile the standalone binary
        run: bun run compile

      - name: Smoke-test the binary
        run: ./dist/suasor --version

      # Build stage only: deps layer + `bun install --frozen-lockfile` +
      # `bun run build` inside the image. This is where the known failure mode
      # lives — a package.json lifecycle script breaks the deps-only layer
      # because of the COPY ordering (see the Dockerfile's own comment).
      # The runtime stage is deliberately NOT built here: it is FROM
      # ollama/ollama and the result is ~5.8 GB, too heavy for every PR, so
      # runtime-stage breakage (ENV / entrypoint / COPY) is still only caught
      # by the release workflow.
      - name: Build the Docker build stage
        run: docker build --target build -t suasor-ci-build .

  lint:
    name: lint (biome + markdown + doc links)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome
        run: bun run lint

      - name: Markdownlint
        run: bun run lint:md

      # Link *targets* (#543). Markdownlint checks link syntax and same-file
      # `#fragment`s (MD051) but never whether a relative target exists, so an
      # ADR rename leaves silently dead links behind. See the header of
      # scripts/check-doc-links.mjs for the exact scope.
      - name: Doc links
        run: bun run lint:links

  # Security & workflow quality gates. These mirror the local lefthook hooks
  # (gitleaks / trivy live in lefthook-base.yaml, actionlint in lefthook.yaml)
  # but CI is the source of truth: a PR that bypasses local hooks (e.g.
  # --no-verify, or a web edit) is still guarded here (#234). Tool versions are
  # pinned in .mise.toml and installed via mise-action to stay in lockstep.
  security:
    name: security (gitleaks + trivy + actionlint)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # gitleaks scans git history, so it needs full history rather than the
          # default shallow (depth 1) checkout.
          fetch-depth: 0

      - name: Install pinned tools (mise)
        uses: jdx/mise-action@v4
        with:
          # Only the tools this job needs; avoids installing the full toolchain.
          install_args: gitleaks trivy actionlint

      - name: Gitleaks (secret scan, full history)
        run: gitleaks git --no-banner --redact --exit-code 1

      - name: Trivy (vuln + secret scan)
        run: trivy fs --scanners vuln,secret --exit-code 1 --no-progress .

      - name: Actionlint (workflow lint)
        run: actionlint
